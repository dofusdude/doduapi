name: Tests

on:
  push:
    branches: [ "main", "beta" ]
  pull_request:
    branches: [ "main", "beta" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -race ./...

  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        game: [dofus3, dofus3beta]
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_MASTER_KEY: contract-test-key
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Wait for isolated search service
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7700/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Full HTTP contract against real search and SQLite
        env:
          GOWORK: 'off'
          DODUAPI_CONTRACT: '1'
          API_TEST_GAME: ${{ matrix.game }}
          DODUAPI_TEST_MEILI_URL: http://127.0.0.1:7700
          DODUAPI_TEST_MEILI_KEY: contract-test-key
        run: go test -race -count=1 -timeout=12m -json -run '^TestAPIContract$' . > contract-results.jsonl
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-results-${{ matrix.game }}
          path: contract-results.jsonl
